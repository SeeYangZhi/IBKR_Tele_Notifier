# ============================================================================
# IBC config for read-only IB Gateway (LIVE).
# deploy/setup.sh copies this to ~/ibc/config.ini (chmod 600) and never
# overwrites an existing one. THIS tracked template must stay credential-free:
# fill IbLoginId/IbPassword only in the deployed copy on the host.
# ============================================================================

# ---- FILL THESE TWO ON THE HOST ONLY — never in the repo ------------------
IbLoginId=
IbPassword=
# ----------------------------------------------------------------------------

# LIVE trading account (not paper).
TradingMode=live

# --- Forced daily restart, hands-free -------------------------------------
# Do NOT auto-close the Gateway; let it restart instead so the session token
# is kept (no re-login / no 2FA on the daily cycle). Pair this with Gateway's
# own "Auto restart" toggle (Configure > Lock and Exit > Auto restart), which
# you set once via VNC.
IbAutoClosedown=no
# Time of the daily soft restart, in the service's TZ (DEPLOY_TZ in setup.sh).
# setup.sh substitutes AUTO_RESTART_TIME (default 12:00). Pick a time when the
# market you actively trade is CLOSED.
AutoRestartTime=@AUTO_RESTART_TIME@

# Let your mobile/TWS logins win. On "Existing session detected" the Gateway
# YIELDS instead of reclaiming, so logging in on your phone no longer boots it.
# While you're logged in on mobile the notifier sits disconnected and reconnects
# after you log out. (primary = Gateway hogs the session and kicks mobile.)
ExistingSessionDetectedAction=secondary

# --- API: force the read-only, localhost-only contract --------------------
# Auto-accept the incoming API connection from the notifier (no GUI popup).
AcceptIncomingConnectionAction=accept
# Enforce read-only API at the IBC layer too (belt-and-suspenders; you also
# tick "Read-Only API" in the GUI). The notifier never places orders anyway.
ReadOnlyApi=yes
# Force the API socket port regardless of the saved GUI value.
OverrideTwsApiPort=4001
# Pin the Master API Client ID so it self-heals if the GUI setting is ever lost
# (must equal the notifier's IB_CLIENT_ID so it captures fills from ALL sources).
OverrideTwsMasterClientID=10
# We still log in with full (non-read-only) privileges so positions/account
# values are readable for the notifications.
ReadOnlyLogin=no

# --- Keep startup unattended (auto-dismiss benign dialogs) ----------------
AcceptNonBrokerageAccountWarning=yes
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes
AllowBlindTrading=no
MinimizeMainWindow=no

# --- 2FA behaviour --------------------------------------------------------
# Auto-select the 2FA device so IBC clicks through the "Select second factor
# device" dialog on full re-logins; the push then goes to your phone (IB Key).
# Must match a device label IBKR offers exactly (e.g. "IB Key").
SecondFactorDevice=IB Key
# 5-minute window to tap the single IB Key push before it gives up.
SecondFactorAuthenticationTimeout=300
# Send exactly ONE push per login attempt and then wait — do NOT loop. This
# avoids 2FA spam when the Gateway is brought back after you've used mobile.
# Trade-off: a genuinely missed 2FA (e.g. the weekly re-auth while you're away)
# leaves it down until you run `resume`; the daily summary warning flags that.
ReloginAfterSecondFactorAuthenticationTimeout=no

# --- Logging --------------------------------------------------------------
LogComponents=never
