[project]
name = "ibkr-tele-notifier"
version = "0.1.0"
description = "Read-only IBKR -> Telegram trade notifier + daily open-positions summary"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ibkr", "interactive-brokers", "telegram", "trading", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "ib_async>=1.0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/SeeYangZhi/IBKR_Tele_Notifier"
Issues = "https://github.com/SeeYangZhi/IBKR_Tele_Notifier/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are mostly explanatory comments
    "SIM105",  # `except Exception: pass` is deliberate in the log forwarder
]
